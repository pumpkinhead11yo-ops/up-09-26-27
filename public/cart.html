<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('technomir-theme');
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>Корзина и оформление заказа – Техномир</title>
  <meta name="description" content="Корзина магазина «Техномир»: проверьте состав заказа, выберите доставку и оплату, оформите покупку.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page-cart">

  <header id="shapka"></header>

  <main>
    <section class="page-hero">
      <div class="box hero-in">
        <div>
          <nav class="kroshki" aria-label="Хлебные крошки">
            <a href="/">Главная</a>
            <span class="sep">/</span>
            <span aria-current="page">Корзина</span>
          </nav>
          <h1 data-reveal>Корзина</h1>
          <p class="hero-text" data-reveal style="--d:70ms">
            Проверьте состав заказа, выберите доставку и оплату – остальное мы возьмём на себя.
          </p>
        </div>
        <aside class="hero-aside" data-reveal style="--d:120ms">
          <span class="mono">Оформление</span>
          <b>4 шага</b>
          <span class="mono">≈ 2 минуты</span>
        </aside>
      </div>
    </section>

    <section class="cart-section">
      <div class="box" id="korzina">
        <div class="loading"><span class="spinner"></span> Загрузка корзины…</div>
      </div>
    </section>
  </main>

  <footer id="podval"></footer>

  <script src="/lib/lucide.min.js"></script>
  <script src="/js/script.js"></script>
  <script>
    const DELIVERY = {
      pickup: {
        name: 'Самовывоз',
        note: 'ТРЦ «Территория Севера» · через 1–2 часа',
        price: 0,
        freeFrom: 0
      },
      courier: {
        name: 'Курьер по Оренбургу',
        note: 'в день заказа · бесплатно от 5 000 ₽',
        price: 300,
        freeFrom: 5000
      },
      post: {
        name: 'Транспортная компания',
        note: 'СДЭК, Деловые Линии · бесплатно от 10 000 ₽',
        price: 500,
        freeFrom: 10000
      }
    };

    const PAYMENT = {
      card_online: { name: 'Картой онлайн', note: 'Visa, Mastercard, МИР' },
      card_pickup: { name: 'Картой при получении', note: 'терминал в пункте выдачи' },
      cash: { name: 'Наличными', note: 'курьеру или в магазине' }
    };

    const PICKUP_POINTS = [
      'ТРЦ «Территория Севера», пр-кт Дзержинского, 23',
      'ТЦ «Галерея», ул. Терешковой, 29',
      'ТЦ «Мега», ул. Салмышская, 18'
    ];

    let cartItems = [];
    let cartTotal = 0;

    async function loadCart() {
      const view = document.getElementById('korzina');
      try {
        cartItems = await Cart.items();
        cartTotal = Math.round(cartItems.reduce((sum, item) => sum + item.price * item.qty, 0) * 100) / 100;

        if (!cartItems.length) {
          view.innerHTML = `
            <div class="empty-state empty-wide" style="min-height:420px">
              <span class="empty-ico">${icon('shopping-bag')}</span>
              <h3>Корзина пуста</h3>
              <p>Добавьте товары из каталога, чтобы оформить заказ. Мы поможем выбрать технику под ваши задачи.</p>
              <a class="btn btn-dark" href="/catalog.html">${icon('arrow-left')} Перейти в каталог</a>
            </div>`;
          refreshIcons();
          return;
        }

        renderCheckout(view);
      } catch (error) {
        view.innerHTML = `
          <div class="empty-state empty-wide">
            <span class="empty-ico">${icon('triangle-alert')}</span>
            <h3>Не удалось загрузить корзину</h3>
            <p>${escapeHtml(error.message)}</p>
            <button class="btn btn-dark" type="button" onclick="loadCart()">Повторить</button>
          </div>`;
        refreshIcons();
      }
    }

    function renderCheckout(view) {
      const itemCount = cartItems.reduce((sum, item) => sum + item.qty, 0);
      view.innerHTML = `
        <div class="cart-layout">
          <div>
            <div class="cart-block">
              <div class="cart-head">
                <span class="mono">Состав заказа</span>
                <span class="mono"><b>${itemCount}</b> ${plural(itemCount, 'товар', 'товара', 'товаров')}</span>
              </div>
              <div class="korzina-list" id="korzina-list">
                ${cartItems.map(cartRow).join('')}
              </div>
            </div>

            <div class="cart-acts">
              <a class="btn btn-ghost btn-sm" href="/catalog.html">${icon('arrow-left')} Продолжить покупки</a>
              <button class="btn btn-ghost btn-sm" type="button" onclick="clearCart()">${icon('trash-2')} Очистить корзину</button>
            </div>

            <form class="oformlenie" id="oformlenie" onsubmit="submitOrder(event)">
              <div class="check-step">
                <div class="step-head">
                  <span class="step-num">01</span>
                  <h2>Получатель</h2>
                </div>
                <div id="order-alert"></div>
                <div class="form-grid">
                  <div class="form-field">
                    <label for="f-name">Имя и фамилия <span>*</span></label>
                    <input type="text" id="f-name" required placeholder="Иван Иванов" autocomplete="name">
                  </div>
                  <div class="form-field">
                    <label for="f-phone">Телефон <span>*</span></label>
                    <input type="tel" id="f-phone" required placeholder="+7 (___) ___-__-__" autocomplete="tel">
                  </div>
                  <div class="form-field full">
                    <label for="f-email">Email <span>*</span></label>
                    <input type="email" id="f-email" required placeholder="you@example.com" autocomplete="email">
                  </div>
                </div>
              </div>

              <div class="check-step">
                <div class="step-head">
                  <span class="step-num">02</span>
                  <h2>Способ доставки</h2>
                </div>
                <div class="radio-cards">
                  ${Object.entries(DELIVERY).map(([key, delivery], index) => `
                    <label class="radio-card">
                      <input type="radio" name="delivery" value="${key}" ${index === 1 ? 'checked' : ''} onchange="updateDeliveryUI()">
                      <div>
                        <b>${delivery.name}</b>
                        <span>${delivery.note}</span>
                      </div>
                      <span class="radio-price">${delivery.price ? fmtPrice(delivery.price) : 'Бесплатно'}</span>
                    </label>`).join('')}
                </div>
              </div>

              <div class="check-step">
                <div class="step-head">
                  <span class="step-num">03</span>
                  <h2>Адрес получения</h2>
                </div>
                <div class="form-grid">
                  <div class="form-field">
                    <label for="f-city">Город <span>*</span></label>
                    <input type="text" id="f-city" required placeholder="Оренбург" value="Оренбург" autocomplete="address-level2">
                  </div>
                  <div class="form-field">
                    <label for="f-postal">Индекс <span id="postal-note" class="text-muted"></span></label>
                    <input type="text" id="f-postal" placeholder="460000" inputmode="numeric" autocomplete="postal-code">
                  </div>
                  <div class="form-field full" id="address-field">
                    <label for="f-address">Адрес доставки <span>*</span></label>
                    <input type="text" id="f-address" required placeholder="ул. Советская, д. 10, кв. 5" autocomplete="street-address">
                  </div>
                  <div class="form-field full" id="pickup-field" hidden>
                    <label for="f-pickup">Пункт выдачи <span>*</span></label>
                    <select id="f-pickup" required>
                      <option value="">Выберите пункт выдачи</option>
                      ${PICKUP_POINTS.map(point => `<option value="${escapeHtml(point)}">${escapeHtml(point)}</option>`).join('')}
                    </select>
                  </div>
                  <div class="form-field full">
                    <label for="f-comment">Комментарий к заказу</label>
                    <textarea id="f-comment" rows="3" placeholder="Удобное время доставки, пожелания по комплектации…"></textarea>
                  </div>
                </div>
              </div>

              <div class="check-step">
                <div class="step-head">
                  <span class="step-num">04</span>
                  <h2>Способ оплаты</h2>
                </div>
                <div class="radio-cards">
                  ${Object.entries(PAYMENT).map(([key, payment], index) => `
                    <label class="radio-card">
                      <input type="radio" name="payment" value="${key}" ${index === 0 ? 'checked' : ''} onchange="updatePaymentUI()">
                      <div>
                        <b>${payment.name}</b>
                        <span>${payment.note}</span>
                      </div>
                    </label>`).join('')}
                </div>
                <div class="card-fields" id="card-fields" hidden>
                  <div class="form-grid">
                    <div class="form-field full">
                      <label for="f-card">Номер карты <span>*</span></label>
                      <input type="text" id="f-card" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" maxlength="19" oninput="formatCardNumber()">
                    </div>
                    <div class="form-field">
                      <label for="f-expiry">Срок действия <span>*</span></label>
                      <input type="text" id="f-expiry" inputmode="numeric" autocomplete="cc-exp" placeholder="ММ/ГГ" maxlength="5" oninput="formatCardExpiry()">
                    </div>
                    <div class="form-field">
                      <label for="f-cvv">CVC / CVV <span>*</span></label>
                      <input type="text" id="f-cvv" inputmode="numeric" autocomplete="cc-csc" placeholder="•••" maxlength="4">
                    </div>
                  </div>
                  <p class="form-note">Данные карты не сохраняются и не передаются в заказ.</p>
                </div>
              </div>
            </form>
          </div>

          <aside class="summary">
            <div class="summary-head">
              <span>Ваш заказ</span>
              <b>${itemCount} шт.</b>
            </div>
            <div class="sum-items" id="sum-items">
              ${cartItems.map(item => `
                <div class="summary-item">
                  <span>${escapeHtml(item.name)} × ${item.qty}</span>
                  <span>${fmtPrice(item.price * item.qty)}</span>
                </div>`).join('')}
            </div>
            <div class="summary-row"><span>Товары</span><b id="sum-tovary">${fmtPrice(cartTotal)}</b></div>
            <div class="summary-row"><span>Доставка</span><b id="sum-dost">–</b></div>
            <div class="summary-total">
              <span>Итого</span>
              <span class="price-now" id="sum-total">–</span>
            </div>
            <button class="btn btn-acid btn-block" type="submit" form="oformlenie" id="order-submit">
              ${icon('shield-check')} Оформить заказ
            </button>
            <p class="summary-note">
              Нажимая кнопку, вы соглашаетесь с условиями обработки персональных данных.
            </p>
            <ul class="summary-perks">
              <li>${icon('truck')} Доставка по Оренбургу в день заказа</li>
              <li>${icon('shield-check')} Гарантия и проверка товара перед выдачей</li>
              <li>${icon('rotate-ccw')} 14 дней на возврат без объяснения причин</li>
            </ul>
          </aside>
        </div>`;

      const user = Auth.user();
      if (user) {
        document.getElementById('f-name').value = user.username || '';
        document.getElementById('f-email').value = user.email || '';
      }

      updateDeliveryUI();
      updatePaymentUI();
      refreshIcons();
      Remotion.scan(view);
    }

    function cartRow(item) {
      const max = Math.min(Math.max(item.stock, 1), 99);
      return `
        <article class="cart-row" data-id="${item.id}">
          <a class="cart-img" href="/product.html?id=${item.id}">
            <img src="${productImage(item.image)}" alt="${escapeHtml(item.name)}" loading="lazy" decoding="async">
          </a>
          <div class="cart-body">
            <div class="cart-top">
              <div>
                <a class="cart-name" href="/product.html?id=${item.id}">${escapeHtml(item.name)}</a>
                <div class="cart-meta">
                  ${fmtPrice(item.price)} / шт. ·
                  ${item.stock > 0 ? `в наличии ${item.stock} шт.` : '<span class="text-error">нет в наличии</span>'}
                </div>
              </div>
              <button class="cart-remove" type="button" onclick="removeItem(${item.id})" aria-label="Удалить товар" title="Удалить">
                ${icon('x')}
              </button>
            </div>
            <div class="cart-bottom">
              <div class="qty qty-sm">
                <button type="button" onclick="changeItemQty(${item.id}, -1)" aria-label="Уменьшить количество">${icon('minus')}</button>
                <input type="number" value="${item.qty}" min="1" max="${max}" data-qty="${item.id}" onchange="setItemQty(${item.id}, this.value)" aria-label="Количество товара">
                <button type="button" onclick="changeItemQty(${item.id}, 1)" aria-label="Увеличить количество">${icon('plus')}</button>
              </div>
              <span class="cart-sum" data-sum="${item.id}">${fmtPrice(item.price * item.qty)}</span>
            </div>
          </div>
        </article>`;
    }

    function selectedDeliveryKey() {
      return document.querySelector('input[name="delivery"]:checked')?.value || 'courier';
    }

    function deliveryCost() {
      const delivery = DELIVERY[selectedDeliveryKey()] || DELIVERY.courier;
      if (!delivery.price) return 0;
      return cartTotal >= delivery.freeFrom ? 0 : delivery.price;
    }

    function updateSummary() {
      const cost = deliveryCost();
      const grand = Math.round((cartTotal + cost) * 100) / 100;

      const productsEl = document.getElementById('sum-tovary');
      const deliveryEl = document.getElementById('sum-dost');
      const totalEl = document.getElementById('sum-total');
      const itemsEl = document.getElementById('sum-items');

      if (productsEl) productsEl.textContent = fmtPrice(cartTotal);
      if (deliveryEl) deliveryEl.textContent = cost ? fmtPrice(cost) : 'Бесплатно';
      if (totalEl) totalEl.textContent = fmtPrice(grand);
      if (itemsEl) {
        itemsEl.innerHTML = cartItems.map(item => `
          <div class="summary-item">
            <span>${escapeHtml(item.name)} × ${item.qty}</span>
            <span>${fmtPrice(item.price * item.qty)}</span>
          </div>`).join('');
      }
    }

    function updateDeliveryUI() {
      const key = selectedDeliveryKey();
      const address = document.getElementById('f-address');
      const pickup = document.getElementById('f-pickup');
      const addressField = document.getElementById('address-field');
      const pickupField = document.getElementById('pickup-field');
      const postal = document.getElementById('f-postal');
      const postalNote = document.getElementById('postal-note');

      if (addressField) addressField.hidden = key === 'pickup';
      if (pickupField) pickupField.hidden = key !== 'pickup';
      if (address) {
        address.required = key !== 'pickup';
        address.placeholder = key === 'post' ? 'Населённый пункт, улица, дом, квартира' : 'ул. Советская, д. 10, кв. 5';
      }
      if (pickup) pickup.required = key === 'pickup';
      if (postalNote) postalNote.textContent = key === 'post' ? '– обязателен' : '';
      if (postal) postal.required = key === 'post';

      updateSummary();
    }

    function selectedPaymentKey() {
      return document.querySelector('input[name="payment"]:checked')?.value || 'card_online';
    }

    function updatePaymentUI() {
      const cardFields = document.getElementById('card-fields');
      if (!cardFields) return;
      const required = selectedPaymentKey() === 'card_online';
      cardFields.hidden = !required;
      ['f-card', 'f-expiry', 'f-cvv'].forEach(id => {
        const input = document.getElementById(id);
        if (input) input.required = required;
      });
    }

    function formatCardNumber() {
      const input = document.getElementById('f-card');
      if (!input) return;
      const digits = input.value.replace(/\D/g, '').slice(0, 16);
      input.value = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
    }

    function formatCardExpiry() {
      const input = document.getElementById('f-expiry');
      if (!input) return;
      const digits = input.value.replace(/\D/g, '').slice(0, 4);
      input.value = digits.length > 2 ? digits.slice(0, 2) + '/' + digits.slice(2) : digits;
    }

    function changeItemQty(id, delta) {
      const item = cartItems.find(product => product.id === id);
      if (!item) return;
      const max = Math.min(Math.max(item.stock, 1), 99);
      setItemQty(id, item.qty + delta, max);
    }

    function setItemQty(id, value, maxOverride) {
      const item = cartItems.find(product => product.id === id);
      if (!item) return;
      const max = maxOverride || Math.min(Math.max(item.stock, 1), 99);
      const qty = Math.max(1, Math.min(max, parseInt(value, 10) || 1));
      item.qty = qty;
      Cart.set(id, qty);

      const input = document.querySelector(`[data-qty="${id}"]`);
      if (input) input.value = qty;
      const rowSum = document.querySelector(`[data-sum="${id}"]`);
      if (rowSum) rowSum.textContent = fmtPrice(item.price * qty);

      cartTotal = Math.round(cartItems.reduce((sum, product) => sum + product.price * product.qty, 0) * 100) / 100;
      updateSummary();
    }

    function removeItem(id) {
      const item = cartItems.find(product => product.id === id);
      cartItems = cartItems.filter(product => product.id !== id);
      Cart.remove(id);

      if (!cartItems.length) {
        Cart.clear();
        loadCart();
        return;
      }

      document.querySelector(`.cart-row[data-id="${id}"]`)?.remove();
      cartTotal = Math.round(cartItems.reduce((sum, product) => sum + product.price * product.qty, 0) * 100) / 100;
      updateSummary();
      toast(`«${item ? item.name : 'Товар'}» удалён из корзины`, 'info');
    }

    function clearCart() {
      if (!confirm('Удалить все товары из корзины?')) return;
      Cart.clear();
      loadCart();
    }

    async function submitOrder(event) {
      event.preventDefault();
      const alertBox = document.getElementById('order-alert');
      alertBox.innerHTML = '';

      const payload = {
        customer_name: document.getElementById('f-name').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        city: document.getElementById('f-city').value.trim(),
        postal_code: document.getElementById('f-postal').value.trim(),
        address: selectedDeliveryKey() === 'pickup'
          ? document.getElementById('f-pickup').value
          : document.getElementById('f-address').value.trim(),
        delivery_method: selectedDeliveryKey(),
        payment_method: selectedPaymentKey(),
        comment: document.getElementById('f-comment').value.trim(),
        items: cartItems.map(item => ({ id: item.id, qty: item.qty }))
      };

      if (!payload.customer_name || !payload.phone || !payload.email) {
        return showAlert(alertBox, 'Заполните имя, телефон и email');
      }
      if (!payload.city) {
        return showAlert(alertBox, 'Укажите город');
      }
      if (payload.delivery_method === 'pickup' && !payload.address) {
        document.getElementById('f-pickup').focus();
        return showAlert(alertBox, 'Выберите пункт выдачи');
      }
      if (payload.delivery_method !== 'pickup' && !payload.address) {
        document.getElementById('f-address').focus();
        return showAlert(alertBox, 'Укажите адрес доставки');
      }
      if (payload.delivery_method === 'post' && !payload.postal_code) {
        document.getElementById('f-postal').focus();
        return showAlert(alertBox, 'Для отправки транспортной компанией укажите индекс');
      }
      if (payload.payment_method === 'card_online') {
        const card = document.getElementById('f-card').value.replace(/\D/g, '');
        const expiry = document.getElementById('f-expiry').value.trim();
        const cvv = document.getElementById('f-cvv').value.replace(/\D/g, '');
        if (card.length !== 16) {
          document.getElementById('f-card').focus();
          return showAlert(alertBox, 'Введите 16 цифр номера карты');
        }
        if (!/^\d{2}\/\d{2}$/.test(expiry)) {
          document.getElementById('f-expiry').focus();
          return showAlert(alertBox, 'Укажите срок действия в формате ММ/ГГ');
        }
        const month = Number(expiry.slice(0, 2));
        if (month < 1 || month > 12) {
          document.getElementById('f-expiry').focus();
          return showAlert(alertBox, 'Укажите корректный месяц срока действия');
        }
        if (cvv.length < 3 || cvv.length > 4) {
          document.getElementById('f-cvv').focus();
          return showAlert(alertBox, 'Введите CVC или CVV карты');
        }
      }

      const button = document.getElementById('order-submit');
      button.disabled = true;
      button.innerHTML = 'Оформляем заказ…';

      try {
        const order = await api('/api/orders', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        Cart.clear();
        document.getElementById('korzina').innerHTML = `
          <div class="order-success">
            <div class="success-icon">${icon('check')}</div>
            <h2>Заказ оформлен!</h2>
            <p>Номер вашего заказа:</p>
            <div class="order-number">${escapeHtml(order.order_number)}</div>
            <p>
              Мы отправили подтверждение на ${escapeHtml(payload.email)}.
              Сохраните номер заказа – по нему можно отслеживать статус доставки.
            </p>
            <div class="btn-row">
              <a class="btn btn-dark" href="/track.html?number=${encodeURIComponent(order.order_number)}">${icon('package-search')} Отследить заказ</a>
              <a class="btn btn-ghost" href="/catalog.html">Продолжить покупки</a>
            </div>
            ${Auth.user() ? '' : '<p class="form-note" style="margin-top:18px">Хотите видеть историю покупок? <a href="/login.html">Войдите в личный кабинет</a>.</p>'}
          </div>`;
        refreshIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        showAlert(alertBox, error.message);
        alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        button.disabled = false;
        button.innerHTML = `${icon('shield-check')} Оформить заказ`;
        refreshIcons();
      }
    }

    loadCart();
  </script>
