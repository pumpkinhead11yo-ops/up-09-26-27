<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('technomir-theme');
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>Товар – Техномир</title>
  <meta name="description" content="Подробная карточка товара в магазине электроники «Техномир»: характеристики, отзывы, доставка и оплата.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page-product">

  <header id="shapka"></header>

  <main class="tovar-page">
    <div class="box">
      <nav class="kroshki" id="kroshki" aria-label="Хлебные крошки">
        <a href="/">Главная</a>
        <span class="sep">/</span>
        <a href="/catalog.html">Каталог</a>
        <span class="sep">/</span>
        <span>Товар</span>
      </nav>

      <div id="tovar-box">
        <div class="loading"><span class="spinner"></span> Загрузка товара…</div>
      </div>
    </div>
  </main>

  <footer id="podval"></footer>

  <script src="/lib/lucide.min.js"></script>
  <script src="/js/script.js"></script>
  <script>
    const productId = new URLSearchParams(location.search).get('id');
    let currentProduct = null;
    let qty = 1;
    let selectedRating = 0;

    async function loadProduct() {
      if (!productId) {
        document.getElementById('tovar-box').innerHTML = `
          <div class="empty-state empty-wide" style="margin-top:28px">
            <span class="empty-ico">${icon('circle-help')}</span>
            <h3>Товар не указан</h3>
            <p>Перейдите в каталог и выберите нужную модель.</p>
            <a class="btn btn-dark" href="/catalog.html">Открыть каталог</a>
          </div>`;
        refreshIcons();
        return;
      }

      try {
        const product = await api('/api/products/' + productId);
        currentProduct = product;
        document.title = `${product.name} – купить в «Техномире»`;
        renderProduct(product);
        loadReviews(product.id);
        loadRelated(product);
      } catch (error) {
        document.getElementById('tovar-box').innerHTML = `
          <div class="empty-state empty-wide" style="margin-top:28px">
            <span class="empty-ico">${icon('triangle-alert')}</span>
            <h3>Товар не найден</h3>
            <p>${escapeHtml(error.message)}</p>
            <a class="btn btn-dark" href="/catalog.html">Вернуться в каталог</a>
          </div>`;
        refreshIcons();
      }
    }

    function renderProduct(product) {
      const inStock = product.stock > 0;
      const lowStock = inStock && product.stock <= 3;
      const discount = product.old_price
        ? Math.round((1 - product.price / product.old_price) * 100)
        : 0;
      const specs = Object.entries(product.specs || {});
      const compareActive = Compare.has(product.id);
      const sku = 'TM-' + String(product.id).padStart(4, '0');

      document.getElementById('kroshki').innerHTML = `
        <a href="/">Главная</a>
        <span class="sep">/</span>
        <a href="/catalog.html">Каталог</a>
        <span class="sep">/</span>
        <a href="/catalog.html?category=${encodeURIComponent(product.category_slug)}">${escapeHtml(product.category_name)}</a>
        <span class="sep">/</span>
        <span aria-current="page">${escapeHtml(product.name)}</span>`;

      document.getElementById('tovar-box').innerHTML = `
        <div class="tovar-view">
          <div class="gallery">
            <div class="gal-main">
              <div class="gal-badges">
                ${discount ? `<span class="tag tag-sale">−${discount}%</span>` : ''}
                ${product.is_featured ? '<span class="tag tag-acid">Хит сезона</span>' : ''}
                <span class="tag tag-line">Официальная гарантия</span>
              </div>
              <img src="${productImage(product.image)}" alt="${escapeHtml(product.name)}" fetchpriority="high" decoding="async">
              <span class="gal-sticker">Проверено<br>вручную</span>
            </div>
            <div class="gal-foot">
              <span>${icon('shield-check')} Гарантия до 2 лет</span>
              <span>${icon('rotate-ccw')} 14 дней на возврат</span>
              <span>${icon('settings-2')} Настройка при вас</span>
            </div>
          </div>

          <div class="tovar-info">
            <div class="tovar-info-top">
              <a class="tovar-cat" href="/catalog.html?category=${encodeURIComponent(product.category_slug)}">
                ${escapeHtml(product.category_name)}
                ${icon('arrow-up-right')}
              </a>
              <span class="tovar-sku">SKU ${sku}</span>
            </div>

            <h1>${escapeHtml(product.name)}</h1>

            <div class="tovar-rating" id="tovar-rating">
              ${stars(product.rating)}
              <span>${product.review_count
                ? `${product.rating} · ${product.review_count} ${plural(product.review_count, 'отзыв', 'отзыва', 'отзывов')}`
                : 'Пока нет отзывов'}</span>
              <a href="#reviews" onclick="openTab('reviews')">Читать отзывы</a>
            </div>

            <p class="tovar-desc">${escapeHtml(product.description)}</p>

            <div class="buy-box">
              <div class="buy-price">
                <strong>${fmtPrice(product.price)}</strong>
                ${product.old_price ? `<del>${fmtPrice(product.old_price)}</del>` : ''}
                ${discount ? `<span class="tag tag-sale">−${discount}%</span>` : ''}
              </div>
              <div class="buy-credit">
                ${product.old_price
                  ? `Экономия ${fmtPrice(product.old_price - product.price)} · рассрочка 0% на 6 месяцев`
                  : 'Рассрочка 0% на 6 месяцев · оплата картой, СБП или наличными'}
              </div>

              <div class="buy-stock ${inStock ? (lowStock ? 'is-low' : '') : 'is-out'}">
                ${inStock
                  ? (lowStock ? `Осталось всего ${product.stock} шт.` : `В наличии: ${product.stock} шт.`)
                  : 'Нет в наличии – уточните поступление'}
              </div>

              <div class="buy-row">
                <div class="qty">
                  <button type="button" onclick="changeQty(-1)" aria-label="Уменьшить количество">${icon('minus')}</button>
                  <input type="number" id="qty" value="1" min="1" max="${Math.min(Math.max(product.stock, 1), 99)}" onchange="setQty(this.value)" aria-label="Количество">
                  <button type="button" onclick="changeQty(1)" aria-label="Увеличить количество">${icon('plus')}</button>
                </div>
                <button class="btn btn-acid" type="button" ${inStock ? '' : 'disabled'} onclick="buyNow()">
                  ${icon('zap')} Купить сейчас
                </button>
                <button class="btn btn-dark" type="button" ${inStock ? '' : 'disabled'} onclick="addDetailToCart()">
                  ${icon('shopping-bag')} В корзину
                </button>
              </div>

              <div class="buy-links">
                <button class="buy-link ${compareActive ? 'is-active' : ''}" type="button"
                        data-compare-id="${product.id}" onclick="toggleCompare(${product.id}, this)"
                        aria-pressed="${compareActive}">
                  ${icon('git-compare')} <span>${compareActive ? 'В сравнении' : 'Сравнить'}</span>
                </button>
                <button class="buy-link" type="button" onclick="openTab('delivery')">
                  ${icon('truck')} Доставка и оплата
                </button>
                <button class="buy-link" type="button" onclick="openTab('reviews')">
                  ${icon('message-square')} Отзывы
                </button>
              </div>
            </div>

            <ul class="tovar-perks">
              <li>${icon('store')}<span><b>Самовывоз</b> – ТРЦ «Территория Севера», пр-кт Дзержинского, 23. Бесплатно, готовность через 1–2 часа.</span></li>
              <li>${icon('truck')}<span><b>Курьер по Оренбургу</b> – в день заказа, бесплатно при покупке от 5 000 ₽.</span></li>
              <li>${icon('settings-2')}<span><b>Настройка при вас</b> – установим ПО и перенесём данные на новое устройство.</span></li>
            </ul>
          </div>
        </div>

        <div class="tabs" id="reviews">
          <div class="tab-buttons" role="tablist">
            <button class="tab-btn is-active" type="button" onclick="openTab('specs', this)">Характеристики</button>
            <button class="tab-btn" type="button" onclick="openTab('description', this)">Описание</button>
            <button class="tab-btn" type="button" onclick="openTab('reviews', this)">
              Отзывы <span id="count-otzyv"></span>
            </button>
            <button class="tab-btn" type="button" onclick="openTab('delivery', this)">Доставка и оплата</button>
          </div>

          <div class="tab-panel is-active" id="tab-specs">
            <div class="panel-card">
              <h3>Технические характеристики</h3>
              <table class="specs-table">
                <tbody>
                  <tr><th>Категория</th><td>${escapeHtml(product.category_name)}</td></tr>
                  <tr><th>Артикул</th><td>${sku}</td></tr>
                  <tr><th>Наличие на складе</th><td>${inStock ? `${product.stock} шт.` : 'нет в наличии'}</td></tr>
                  ${specs.map(([key, value]) => `
                    <tr><th>${escapeHtml(key)}</th><td>${escapeHtml(value)}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="tab-panel" id="tab-desc">
            <div class="panel-card">
              <h3>О товаре</h3>
              <p>${escapeHtml(product.description)}</p>
              <p>
                Все товары магазина «Техномир» проходят проверку перед продажей, имеют официальную
                гарантию и полный комплект документов. При заказе от 5 000 ₽ доставка по Оренбургу
                бесплатная. Наши консультанты помогут настроить устройство и ответят на вопросы
                по эксплуатации в течение гарантийного срока.
              </p>
            </div>
          </div>

          <div class="tab-panel" id="tab-reviews">
            <div class="review-layout">
              <div id="otzyvy-list">
                <div class="loading"><span class="spinner"></span> Загрузка отзывов…</div>
              </div>
              <div class="review-form">
                <h3>Оставить отзыв</h3>
                <div id="review-msg"></div>
                <div class="form-grid">
                  <div class="form-field">
                    <label for="rev-name">Ваше имя <span>*</span></label>
                    <input type="text" id="rev-name" placeholder="Иван И.">
                  </div>
                  <div class="form-field">
                    <label>Ваша оценка <span>*</span></label>
                    <div class="rating-input" id="rev-rating">
                      ${[1, 2, 3, 4, 5].map(n => `<button type="button" data-value="${n}" onclick="setRating(${n})" aria-label="${n} из 5">${icon('star')}</button>`).join('')}
                    </div>
                  </div>
                  <div class="form-field">
                    <label for="rev-text">Отзыв <span>*</span></label>
                    <textarea id="rev-text" rows="4" placeholder="Расскажите о товаре: плюсы, минусы, впечатления…"></textarea>
                  </div>
                </div>
                <button class="btn btn-dark btn-block" type="button" onclick="submitReview()">Отправить отзыв</button>
              </div>
            </div>
          </div>

          <div class="tab-panel" id="tab-delivery">
            <div class="panel-card">
              <h3>Способы доставки</h3>
              <ul class="delivery-list">
                <li>
                  <span class="mini-icon">${icon('store')}</span>
                  <div><b>Самовывоз</b><span>Пункт выдачи: ТРЦ «Территория Севера», пр-кт Дзержинского, 23. Бесплатно, готовность через 1–2 часа.</span></div>
                </li>
                <li>
                  <span class="mini-icon">${icon('truck')}</span>
                  <div><b>Курьер по Оренбургу</b><span>В день заказа при оформлении до 16:00. От 300 ₽, бесплатно при заказе от 5 000 ₽.</span></div>
                </li>
                <li>
                  <span class="mini-icon">${icon('package')}</span>
                  <div><b>Транспортные компании</b><span>СДЭК, Деловые Линии, Почта России. Отправка в течение 1 рабочего дня.</span></div>
                </li>
              </ul>

              <h3 style="margin-top:26px">Оплата</h3>
              <ul class="delivery-list">
                <li>
                  <span class="mini-icon">${icon('credit-card')}</span>
                  <div><b>Банковской картой</b><span>Онлайн при оформлении или при получении заказа.</span></div>
                </li>
                <li>
                  <span class="mini-icon">${icon('smartphone')}</span>
                  <div><b>СБП</b><span>Оплата через Систему быстрых платежей по QR-коду.</span></div>
                </li>
                <li>
                  <span class="mini-icon">${icon('banknote')}</span>
                  <div><b>Наличными</b><span>В пункте выдачи или курьеру при получении.</span></div>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <section class="section sec-tight" id="pokhozhie" hidden>
          <div class="sec-head">
            <div class="head-copy">
              <h2 class="sec-title">Похожие <em>товары.</em></h2>
            </div>
            <div class="head-acts">
              <a class="btn btn-ghost" href="/catalog.html?category=${encodeURIComponent(product.category_slug)}">
                Вся категория ${icon('arrow-right')}
              </a>
            </div>
          </div>
          <div class="tovary" id="pokhozhie-grid"></div>
        </section>`;

      refreshIcons();
      Compare.updateUI();
      Remotion.scan(document.getElementById('tovar-box'));
    }

    function openTab(name, button) {
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('is-active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('is-active'));
      const panel = document.getElementById('tab-' + name);
      if (panel) panel.classList.add('is-active');
      if (button) button.classList.add('is-active');
      else {
        const index = ['specs', 'description', 'reviews', 'delivery'].indexOf(name);
        const buttons = document.querySelectorAll('.tab-btn');
        if (buttons[index]) buttons[index].classList.add('is-active');
      }
      if (name === 'reviews') {
        const tabs = document.querySelector('.tabs');
        if (tabs) tabs.scrollIntoView({ behavior: prefersReduced() ? 'auto' : 'smooth', block: 'start' });
      }
    }

    function changeQty(delta) {
      const input = document.getElementById('qty');
      if (!input) return;
      setQty(Math.max(1, Math.min(Number(input.max) || 99, (Number(input.value) || 1) + delta)));
    }

    function setQty(value) {
      const input = document.getElementById('qty');
      if (!input) return;
      const max = Number(input.max) || 99;
      qty = Math.max(1, Math.min(max, parseInt(value, 10) || 1));
      input.value = qty;
    }

    function addDetailToCart() {
      if (!currentProduct) return;
      Cart.add(currentProduct.id, qty);
      toast('Товар добавлен в корзину', 'success');
      const button = document.querySelector('.buy-row .btn-dark');
      if (!button) return;
      const original = button.innerHTML;
      button.innerHTML = `${icon('check')} В корзине`;
      button.classList.add('is-added');
      refreshIcons();
      setTimeout(() => {
        button.innerHTML = original;
        button.classList.remove('is-added');
        refreshIcons();
      }, 1400);
    }

    function buyNow() {
      if (!currentProduct) return;
      Cart.add(currentProduct.id, qty);
      location.href = '/cart.html';
    }

    async function loadReviews(id) {
      const list = document.getElementById('otzyvy-list');
      if (!list) return;
      try {
        const reviews = await api(`/api/products/${id}/reviews`);
        const badge = document.getElementById('count-otzyv');
        if (badge) badge.textContent = reviews.length ? `(${reviews.length})` : '';

        const ratingBox = document.getElementById('tovar-rating');
        if (ratingBox) {
          const average = reviews.length
            ? (reviews.reduce((sum, review) => sum + review.rating, 0) / reviews.length).toFixed(1)
            : 0;
          ratingBox.innerHTML = `
            ${stars(average)}
            <span>${reviews.length
              ? `${average} · ${reviews.length} ${plural(reviews.length, 'отзыв', 'отзыва', 'отзывов')}`
              : 'Пока нет отзывов'}</span>
            <a href="#reviews" onclick="openTab('reviews')">Читать отзывы</a>`;
          refreshIcons();
        }

        if (!reviews.length) {
          list.innerHTML = `
            <div class="empty-state">
              <span class="empty-ico">${icon('message-square')}</span>
              <h3>Отзывов пока нет</h3>
              <p>Станьте первым, кто поделится впечатлениями об этом товаре.</p>
            </div>`;
          refreshIcons();
          return;
        }

        list.innerHTML = reviews.map(review => `
          <article class="review-card">
            <div class="review-head">
              <span class="review-name">${escapeHtml(review.author_name)}</span>
              <span>
                ${stars(review.rating)}
                <span class="review-date"> · ${fmtDate(review.created_at)}</span>
              </span>
            </div>
            <p class="review-text">${escapeHtml(review.text)}</p>
          </article>`).join('');
        refreshIcons();
      } catch (error) {
        list.innerHTML = `<p class="text-muted">${escapeHtml(error.message)}</p>`;
      }
    }

    function setRating(value) {
      selectedRating = value;
      document.querySelectorAll('#rev-rating button').forEach((button, index) => {
        button.classList.toggle('on', index < value);
      });
    }

    async function submitReview() {
      const alertBox = document.getElementById('review-msg');
      const name = document.getElementById('rev-name').value.trim();
      const text = document.getElementById('rev-text').value.trim();

      if (!name) return showAlert(alertBox, 'Укажите ваше имя');
      if (!selectedRating) return showAlert(alertBox, 'Поставьте оценку');
      if (text.length < 5) return showAlert(alertBox, 'Напишите текст отзыва – хотя бы пару слов');

      const button = document.querySelector('.review-form > .btn');
      button.disabled = true;
      try {
        await api(`/api/products/${currentProduct.id}/reviews`, {
          method: 'POST',
          body: JSON.stringify({ author_name: name, rating: selectedRating, text })
        });
        showAlert(alertBox, 'Спасибо! Отзыв опубликован.', 'success');
        document.getElementById('rev-text').value = '';
        setRating(0);
        loadReviews(currentProduct.id);
      } catch (error) {
        showAlert(alertBox, error.message);
      } finally {
        button.disabled = false;
      }
    }

    async function loadRelated(product) {
      try {
        const products = await api('/api/products?category=' + encodeURIComponent(product.category_slug));
        const related = products.filter(item => item.id !== product.id).slice(0, 4);
        if (!related.length) return;
        const section = document.getElementById('pokhozhie');
        section.hidden = false;
        renderProductsGrid(document.getElementById('pokhozhie-grid'), related);
      } catch {}
    }

    loadProduct();
  </script>
</body>
</html>
