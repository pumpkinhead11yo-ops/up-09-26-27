<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('technomir-theme');
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>Личный кабинет – Техномир</title>
  <meta name="description" content="Личный кабинет покупателя магазина «Техномир»: история заказов, статус доставки и отзывы.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page-profile">

  <header id="shapka"></header>

  <main>
    <section class="page-hero">
      <div class="box hero-in">
        <div>
          <nav class="kroshki" aria-label="Хлебные крошки">
            <a href="/">Главная</a>
            <span class="sep">/</span>
            <span aria-current="page">Личный кабинет</span>
          </nav>
          <h1 data-reveal>Кабинет</h1>
          <p class="hero-text" data-reveal style="--d:70ms">
            История заказов, статус доставки и данные вашего аккаунта.
          </p>
        </div>
        <aside class="hero-aside" data-reveal style="--d:120ms">
          <span class="mono">Личный кабинет</span>
          <b>с 2022</b>
          <span class="mono">Оренбург</span>
        </aside>
      </div>
    </section>

    <section class="kab-section">
      <div class="box">
        <div class="kabinet" id="kabinet">
          <aside class="kab-side" id="kab-side">
            <div class="loading"><span class="spinner"></span></div>
          </aside>
          <div class="kab-main" id="kab-main">
            <div class="loading"><span class="spinner"></span> Загрузка кабинета…</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="podval"></footer>

  <script src="/lib/lucide.min.js"></script>
  <script src="/js/script.js"></script>
  <script>
    const STEPS = ['new', 'paid', 'packed', 'shipping', 'done'];
    const STEP_LABELS = ['Новый', 'Оплачен', 'Укомплектован', 'В доставке', 'Выполнен'];
    const PICKUP_STEPS = ['new', 'packed', 'shipping', 'paid', 'done'];
    const PICKUP_STEP_LABELS = ['Новый', 'Укомплектован', 'Готов к выдаче', 'Оплачен', 'Выполнен'];
    const DELIVERY_NAMES = {
      courier: 'Курьер по Оренбургу',
      pickup: 'Самовывоз',
      post: 'Транспортная компания'
    };
    let currentOrders = [];

    async function init() {
      const shell = document.getElementById('kabinet');

      if (!Auth.token()) {
        shell.style.display = 'block';
        shell.innerHTML = `
          <div class="empty-state empty-wide" style="min-height:420px">
            <span class="empty-ico">${icon('user')}</span>
            <h3>Вы не вошли в систему</h3>
            <p>Войдите или зарегистрируйтесь, чтобы видеть историю заказов и статус доставки.</p>
            <div class="btn-row">
              <a class="btn btn-dark" href="/login.html">${icon('log-in')} Войти</a>
              <a class="btn btn-ghost" href="/track.html">Отследить по номеру</a>
            </div>
          </div>`;
        refreshIcons();
        return;
      }

      try {
        const me = await api('/api/auth/me');
        const orders = await api('/api/orders/my');
        currentOrders = orders;
        const totalSpent = orders.reduce((sum, order) => sum + order.total, 0);
        const activeOrders = orders.filter(order => !['done', 'cancelled'].includes(order.status)).length;
        const roleLabel = me.role === 'admin' ? 'Администратор' : 'Покупатель';

        document.getElementById('kab-side').innerHTML = `
          <div class="kab-avatar">${escapeHtml(me.username.slice(0, 1).toUpperCase())}</div>
          <div>
            <h1>${escapeHtml(me.username)}</h1>
            <p class="kab-side-email">${escapeHtml(me.email)}</p>
            <span class="kab-role ${me.role === 'admin' ? 'kab-role-admin' : ''}">${roleLabel}</span>
          </div>
          <div class="kab-side-links">
            <a href="/catalog.html">${icon('layout-grid')} Каталог</a>
            <a href="/track.html">${icon('package-search')} Отследить заказ</a>
            ${me.role === 'admin' ? `<a href="/admin.html">${icon('sliders-horizontal')} Админ-панель</a>` : ''}
            <button class="is-danger" type="button" onclick="Auth.logout()">${icon('log-out')} Выйти</button>
          </div>`;

        document.getElementById('kab-main').innerHTML = `
          <div class="kab-stats">
            <div class="kab-stat">
              <b>${orders.length}</b>
              <span>всего заказов</span>
            </div>
            <div class="kab-stat">
              <b>${activeOrders}</b>
              <span>в обработке</span>
            </div>
            <div class="kab-stat">
              <b>${fmtPrice(totalSpent)}</b>
              <span>сумма покупок</span>
            </div>
          </div>

          ${me.role === 'admin' ? `
            <div class="kab-admin">
              <div>
                <b>Управление магазином</b>
              </div>
              <a class="btn btn-dark btn-sm" href="/admin.html">Открыть админ-панель ${icon('arrow-up-right')}</a>
            </div>` : ''}

          <div class="orders-head">
            <h2>Мои заказы ${orders.length ? `<span class="text-muted">(${orders.length})</span>` : ''}</h2>
            <a class="btn btn-ghost btn-sm" href="/track.html">${icon('package-search')} Отследить другой</a>
          </div>

          <div id="orders-box">
            ${orders.length ? orders.map(renderOrder).join('') : `
              <div class="empty-state">
                <span class="empty-ico">${icon('package')}</span>
                <h3>Заказов пока нет</h3>
                <p>Выберите технику в каталоге – мы поможем с выбором и доставим заказ.</p>
                <a class="btn btn-dark" href="/catalog.html">Перейти в каталог</a>
              </div>`}
          </div>`;

        refreshIcons();
        Remotion.scan(document.getElementById('kab-main'));
      } catch (error) {
        shell.style.display = 'block';
        shell.innerHTML = `
          <div class="alert alert-error">${icon('triangle-alert')}<span>${escapeHtml(error.message)}</span></div>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-ghost btn-sm" type="button" onclick="Auth.logout()">Войти заново</button>
          </div>`;
        refreshIcons();
      }
    }

    function renderOrder(order) {
      const isPickup = order.delivery_method === 'pickup';
      const stepKeys = isPickup ? PICKUP_STEPS : STEPS;
      const labels = isPickup ? PICKUP_STEP_LABELS : STEP_LABELS;
      const index = stepKeys.indexOf(order.status);
      const isCancelled = order.status === 'cancelled';
      const steps = isCancelled ? '' : `
        <div class="status-track">
          ${labels.map((label, stepIndex) => {
            const cls = stepIndex < index ? 'done' : stepIndex === index ? 'current' : '';
            return `<span class="status-step ${cls}">${label}</span>`;
          }).join('')}
        </div>`;

      return `
        <article class="order-card" data-reveal>
          <div class="order-head">
            <span class="order-num">Заказ ${escapeHtml(order.order_number)}</span>
            <span class="tag ${isCancelled ? 'tag-sale' : order.status === 'done' ? 'tag-acid' : 'tag-line'}">
              ${escapeHtml(order.status_text)}
            </span>
          </div>
          <div class="order-items">
            ${order.items.map(item => `
              <div><span>${escapeHtml(item.name)} × ${item.qty}</span><b>${fmtPrice(item.price * item.qty)}</b></div>`).join('')}
          </div>
          <div class="order-meta">
            <span class="text-muted">
              ${fmtDate(order.created_at)} · ${DELIVERY_NAMES[order.delivery_method] || order.delivery_method}
              ${order.city ? ' · ' + escapeHtml(order.city) : ''}
            </span>
            <b>${fmtPrice(order.total)}</b>
          </div>
          ${steps}
          <div class="btn-row" style="margin-top:14px">
            <button class="btn btn-ghost btn-sm" type="button" onclick="repeatOrder(${order.id}, this)">
              ${icon('rotate-ccw')} Повторить заказ
            </button>
            <a class="btn btn-ghost btn-sm" href="/track.html?number=${encodeURIComponent(order.order_number)}">
              ${icon('package-search')} Отследить
            </a>
          </div>
        </article>`;
    }

    function repeatOrder(id, button) {
      const order = currentOrders.find(item => item.id === id);
      if (!order) return;
      const items = (order.items || []).filter(item => item.product_id);
      if (!items.length) return toast('Товары этого заказа больше недоступны', 'error');
      items.forEach(item => Cart.add(item.product_id, item.qty));
      toast('Товары из заказа добавлены в корзину', 'success');
      button.innerHTML = `${icon('check')} Добавлено`;
      refreshIcons();
    }

    init();
  </script>
</body>
</html>
