<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('technomir-theme');
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>Сравнение товаров – Техномир</title>
  <meta name="description" content="Сравните до четырёх моделей электроники по цене, характеристикам, рейтингу и наличию в магазине «Техномир».">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="page-compare">

  <header id="shapka"></header>

  <main>
    <section class="page-hero">
      <div class="box hero-in">
        <div>
          <nav class="kroshki" aria-label="Хлебные крошки">
            <a href="/">Главная</a>
            <span class="sep">/</span>
            <a href="/catalog.html">Каталог</a>
            <span class="sep">/</span>
            <span aria-current="page">Сравнение</span>
          </nav>
          <h1 data-reveal>Сравнение</h1>
          <p class="hero-text" data-reveal style="--d:70ms">
            До четырёх моделей рядом: цена, рейтинг, наличие и технические характеристики.
            Добавляйте товары из каталога кнопкой сравнения.
          </p>
        </div>
        <aside class="hero-aside" data-reveal style="--d:120ms">
          <span class="mono">Лимит</span>
          <b>4 товара</b>
          <span class="mono">одновременно</span>
        </aside>
      </div>
    </section>

    <section class="cmp-section">
      <div class="box">
        <div class="cmp-toolbar">
          <div class="toolbar-right">
            <a class="btn btn-ghost btn-sm" href="/catalog.html"><i data-lucide="plus"></i> Добавить товар</a>
            <button class="btn btn-ghost btn-sm" type="button" onclick="clearCompare()"><i data-lucide="trash-2"></i> Очистить</button>
          </div>
        </div>

        <div id="sravn-box">
          <div class="loading"><span class="spinner"></span> Загрузка сравнения…</div>
        </div>
      </div>
    </section>
  </main>

  <footer id="podval"></footer>

  <script src="/lib/lucide.min.js"></script>
  <script src="/js/script.js"></script>
  <script>
    async function loadCompare() {
      const container = document.getElementById('sravn-box');
      const ids = Compare.get();

      if (!ids.length) {
        container.innerHTML = `
          <div class="empty-state empty-wide" style="min-height:400px">
            <span class="empty-ico">${icon('git-compare')}</span>
            <h3>Список сравнения пуст</h3>
            <p>Откройте каталог и нажмите иконку сравнения на карточке товара – так можно сопоставить до четырёх моделей.</p>
            <a class="btn btn-dark" href="/catalog.html">${icon('arrow-left')} Перейти в каталог</a>
          </div>`;
        refreshIcons();
        return;
      }

      try {
        const products = await api('/api/products?ids=' + ids.join(','));
        const ordered = ids.map(id => products.find(product => product.id === id)).filter(Boolean);

        if (!ordered.length) {
          Compare.clear();
          return loadCompare();
        }

        const keys = [];
        const seen = new Set();
        ordered.forEach(product => {
          Object.keys(product.specs || {}).forEach(key => {
            if (!seen.has(key)) { seen.add(key); keys.push(key); }
          });
        });

        container.innerHTML = `
          ${ordered.length === 1 ? `
            <div class="alert alert-info" style="margin:16px 0 0">
              ${icon('info')}<span>Добавьте ещё хотя бы один товар, чтобы сравнение было наглядным.</span>
            </div>` : ''}

          <div class="cmp-wrap">
            <table class="cmp-table">
              <tbody>
                <tr>
                  <th>Товар</th>
                  ${ordered.map(product => `
                    <td>
                      <div class="cmp-photo">
                        <img src="${productImage(product.image)}" alt="${escapeHtml(product.name)}" loading="lazy" decoding="async">
                        <button class="cmp-remove" type="button" onclick="removeFromCompare(${product.id})" aria-label="Убрать из сравнения">
                          ${icon('x')}
                        </button>
                      </div>
                      <a class="cmp-name" href="/product.html?id=${product.id}">${escapeHtml(product.name)}</a>
                      <span class="cmp-cat">${escapeHtml(product.category_name)}</span>
                    </td>`).join('')}
                </tr>

                <tr>
                  <th>Цена</th>
                  ${ordered.map(product => `
                    <td>
                      <span class="cmp-price">${fmtPrice(product.price)}</span>
                      ${product.old_price ? `<span class="price-old">${fmtPrice(product.old_price)}</span>` : ''}
                    </td>`).join('')}
                </tr>

                <tr>
                  <th>Рейтинг</th>
                  ${ordered.map(product => `
                    <td>
                      <div class="tovar-rating" style="margin:0">
                        ${stars(product.rating)}
                        <span>${product.review_count ? `${product.rating} · ${product.review_count} отз.` : 'нет отзывов'}</span>
                      </div>
                    </td>`).join('')}
                </tr>

                <tr>
                  <th>Наличие</th>
                  ${ordered.map(product => `
                    <td>
                      <span class="buy-stock ${product.stock > 0 ? '' : 'is-out'}" style="margin:0">
                        ${product.stock > 0 ? `в наличии ${product.stock} шт.` : 'нет в наличии'}
                      </span>
                    </td>`).join('')}
                </tr>

                ${keys.map(key => `
                  <tr>
                    <th>${escapeHtml(key)}</th>
                    ${ordered.map(product => `
                      <td>${product.specs && product.specs[key] != null ? escapeHtml(product.specs[key]) : '–'}</td>`).join('')}
                  </tr>`).join('')}

                <tr>
                  <th>Действия</th>
                  ${ordered.map(product => `
                    <td>
                      <div class="cmp-acts">
                        <button class="btn btn-dark btn-sm" type="button"
                                ${product.stock > 0 ? '' : 'disabled'}
                                onclick="addToCart(${product.id}, 1, this)">
                          ${icon('shopping-bag')} <span data-cart-label>В корзину</span>
                        </button>
                        <a class="btn btn-ghost btn-sm" href="/product.html?id=${product.id}">Подробнее</a>
                      </div>
                    </td>`).join('')}
                </tr>
              </tbody>
            </table>
          </div>`;

        refreshIcons();
        Compare.updateUI();
      } catch (error) {
        container.innerHTML = `
          <div class="empty-state empty-wide">
            <span class="empty-ico">${icon('triangle-alert')}</span>
            <h3>Не удалось загрузить сравнение</h3>
            <p>${escapeHtml(error.message)}</p>
            <button class="btn btn-dark" type="button" onclick="loadCompare()">Повторить</button>
          </div>`;
        refreshIcons();
      }
    }

    function removeFromCompare(id) {
      Compare.remove(id);
      loadCompare();
    }

    function clearCompare() {
      if (!Compare.count()) {
        toast('Список сравнения уже пуст', 'info');
        return;
      }
      Compare.clear();
      loadCompare();
    }

    loadCompare();
  </script>
</body>
</html>
